<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Unofficial, community-made MPE firmware mod for the Novation Peak synthesizer, patched and flashed in the browser." />
    <title>Peak MPE patcher</title>
    <script>
      // The colour theme before the first paint (main.ts keeps it in step): the
      // visitor's last choice, else the system's light or dark.
      try {
        var t = localStorage.getItem("peak-mpe-theme");
        if (t !== "light" && t !== "medium" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 12 5 4l3 6 2-3 5 5' fill='none' stroke='%233f97c9' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This page needs JavaScript: it patches and flashes the firmware in your browser.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
